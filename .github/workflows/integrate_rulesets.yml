name: Update Rulesets on SIEM
on:
  push:
    branches: [ "main" ]
    paths: [ "rules/**.xml", "decoders/**.xml" ]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments against the SIEM at the same time, and never cancel
# one halfway through.
concurrency:
  group: siem-deploy
  cancel-in-progress: false

jobs:

  DaaC:
    # The "production" environment holds the SSH secrets. Restrict it to the
    # main branch (Settings > Environments > production > Deployment branches)
    # so workflows on other branches cannot read them. This `if` only stops
    # manual runs of this file from other branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Require SSH host key pinning
        env:
          HOST_FINGERPRINT: ${{ secrets.HOST_FINGERPRINT }}
        run: |
          if [ -z "$HOST_FINGERPRINT" ]; then
            echo "::error::Set the HOST_FINGERPRINT secret (SHA256 host key fingerprint) so the SIEM's identity is verified."
            exit 1
          fi

      - name: Apply modified or new decoders and rules to SIEM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.PORT }}
          fingerprint: ${{ secrets.HOST_FINGERPRINT }}
          # Validates, applies, tests and (on failure) rolls back the ruleset.
          # Installed outside the Git checkout; see deploy/dac-deploy.sh.
          script: sudo /usr/local/sbin/dac-deploy
